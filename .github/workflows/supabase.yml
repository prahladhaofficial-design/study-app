name: Server functions

# Checks the Supabase edge functions on every pull request that changes them,
# and deploys them when they change on main.
# Deploying needs one repository secret: SUPABASE_ACCESS_TOKEN
# (Supabase dashboard, Account, Access Tokens, Generate new token).
on:
  workflow_dispatch:
  pull_request:
    paths: ['supabase/functions/**', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check functions
        # Runs from the functions folder so its deno.json applies instead of the web app's package.json.
        working-directory: supabase/functions
        run: deno check */index.ts

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so functions were not deployed."
            exit 0
          fi
          supabase functions deploy --project-ref xcaioljuutfvujmitwfc
